name: Government Data Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: government-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler dependencies
        run: pip install -r tools/requirements.txt

      # Use the same transport-aware crawler as the scheduled workflow.
      # The former Dart sync emitted null transport fields and could overwrite
      # transport_stop_count populated by this crawler.
      - name: Sync government and transport data
        run: python tools/government_data_crawler.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
