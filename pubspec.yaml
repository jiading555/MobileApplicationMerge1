name: smart_property_advisor
description: Smart Property Advisor for Malaysian property and infrastructure open-data analysis.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^3.6.1
  html: ^0.15.6
  http: ^1.5.0
  image_picker: ^1.2.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/areas.json
    - assets/data/properties.json
    - data/processed/area_profiles.json
    - data/processed/teduh_projects.json

