name: smart_property_advisor
description: Smart Property Advisor for Malaysian property and infrastructure open-data analysis.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  app_links: ^7.2.0
  archive: ^3.6.1
  flutter_map: ^8.3.2
  geolocator: ^14.0.3
  html: ^0.15.6
  http: ^1.5.0
  image_picker: ^1.2.0
  latlong2: ^0.10.1
  path: ^1.9.1
  sqflite: ^2.4.3
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
